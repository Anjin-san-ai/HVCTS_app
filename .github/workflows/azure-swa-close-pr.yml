name: Close SWA preview

# Removes the Static Web Apps preview environment created for a PR by
# azure-deploy.yml once that PR closes, so preview environments don't
# accumulate.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  close-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
