name: Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: azure-deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12'

jobs:
  # ─── Lint + typecheck everything, including server/ (never checked before
  # this pipeline existed — see tsconfig.server.json) ────────────────────
  validate:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ─── SPA → Static Web Apps. Runs on both PRs (preview environment) and
  # pushes to main (production). ─────────────────────────────────────────
  deploy-web:
    name: Deploy web (Static Web Apps)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Substitutes the Entra tenant id into dist/staticwebapp.config.json.
      # If the ENTRA_TENANT_ID repository variable is unset, this instead
      # strips auth entirely and the site deploys PUBLICLY — see
      # docs/DEPLOYMENT.md.
      - run: node scripts/prepare-swa-config.mjs
        env:
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          output_location: ''
          skip_app_build: true
          skip_api_build: true
    outputs:
      static_web_app_url: ${{ steps.deploy.outputs.static_web_app_url }}

  # ─── Express API → App Service. Production only: a PR gets a preview
  # frontend but keeps talking to the production API (no per-PR API slot in
  # this setup — see docs/DEPLOYMENT.md if that's ever needed). ──────────
  deploy-api:
    name: Deploy API (App Service)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build:server

      # Stage a self-contained deployable: compiled server + production-only
      # node_modules. tsx/typescript/vite etc. stay out of the artifact.
      - name: Stage deployment package
        run: |
          set -euo pipefail
          mkdir -p deploy-stage
          cp -r dist-server deploy-stage/dist-server
          cp package.json package-lock.json deploy-stage/
          cd deploy-stage
          npm ci --omit=dev --ignore-scripts
          zip -r ../api.zip . -x '*.map' >/dev/null
          cd ..
          echo "Package contents:"
          unzip -l api.zip | tail -20

      # Publish-profile auth, not OIDC: this tenant's directory permissions
      # blocked creating the app registration OIDC needs (see
      # docs/DEPLOYMENT.md, "Deploying without OIDC"). Switch back to
      # azure/login@v2 + AZURE_CLIENT_ID once that registration exists.
      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api.zip
    outputs:
      webapp_url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

  # ─── Fail the run (and page whoever's watching) if the API isn't actually
  # healthy after deploy, rather than reporting green on a broken API.
  #
  # Hits the SWA-proxied path, not the App Service URL directly: the
  # linked-backend deployment automatically enables App Service
  # authentication scoped to this Static Web App only (identityProviders.
  # azureStaticWebApps), so the App Service now correctly rejects direct
  # calls with 401 — that's a platform security feature, not a bug. ────
  smoke:
    name: Smoke test
    needs: [deploy-web, deploy-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/smoke.mjs "${{ needs.deploy-web.outputs.static_web_app_url }}/api/ai/health" 180
